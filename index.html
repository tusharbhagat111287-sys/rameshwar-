
<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0">
<title>RAMESHWAR NITYAM</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#121212">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Segoe UI',sans-serif;background:#121212;color:#e0e0e0;margin:0;padding-bottom:20px;text-align:center;user-select:none; overflow-x: hidden;}
.container{padding:8px;max-width:600px;margin:auto}

/* Top Nav */
.nav-tabs{background:#181818;padding:12px;display:flex;justify-content:center;gap:15px;position:sticky;top:0;z-index:100;box-shadow:0 4px 15px rgba(0,0,0,0.9)}
.nt-btn{padding:8px 30px;border-radius:20px;font-weight:bold;font-size:13px;background:#252525;color:#888;border:none;cursor:pointer;transition:all 0.2s}
.nt-btn.act{color:#00e5ff;background:#1a1a1a;box-shadow:inset 0px 0px 8px rgba(0, 229, 255, 0.15); border:1px solid #00e5ff;}

/* Header Card: Adjusted for Perfect Alignment */
.header-card{margin-bottom:12px; padding:5px 10px;}
.stat-hdr{color:#fff;font-weight:900;font-size:18px;margin-bottom:15px;text-shadow:0 0 10px #ff007f,0 0 20px #ff007f;letter-spacing:1px}
.clock-row{display:flex;justify-content:space-between;align-items:center;padding:0 15px;margin-bottom:15px;}
.time-text{font-size:28px;font-weight:900;background:linear-gradient(to right, #D4AF37 0%, #FFF8DC 50%, #D4AF37 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent; text-align:left; flex:1;}
.murti-box{position:relative;width:90px;height:90px; flex-shrink:0;}
.center-murti{width:90px;height:90px;border-radius:50%;border:2px solid #FFD700;box-shadow:0 0 15px rgba(255,215,0,0.6);object-fit:cover;}
.badge{position:absolute;right:-5px;top:35px;font-size:10px;padding:4px 8px;border-radius:6px;font-weight:bold;background:#4caf50;color:#fff;box-shadow:0 2px 5px rgba(0,0,0,0.5);}
.badge.offline{background:#f44336}

.status-pill{background:#111;color:#00e676;border-radius:8px;padding:10px;font-size:13px;font-weight:bold;border:1px solid #222; overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}

/* Grid Buttons */
.q-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.q-btn{border:none;border-radius:8px;padding:16px 5px;color:#fff;font-weight:bold;width:100%;cursor:pointer;font-size:14px;background:#222;transition:all 0.2s;}
.b-blu{border-bottom:4px solid #2196f3}.b-org{border-bottom:4px solid #ff9800}.b-yel{border-bottom:4px solid #fbc02d;color:#fbc02d}.b-pur{border-bottom:4px solid #9c27b0}

/* Active Green Class */
.btn-active { background: #4caf50 !important; color: #fff !important; border-bottom-color: #2e7d32 !important; box-shadow: 0 0 10px rgba(76, 175, 80, 0.4); }

/* Middle Player Section */
.card{background:#1a1a1a;border-radius:15px;padding:15px;margin-bottom:12px;border:1px solid #2a2a2a;}
.t-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}
.sq-btn{width:48px;height:48px;border-radius:8px;background:#222;color:#00bcd4;border:none;border-bottom:4px solid #00bcd4;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.t-name{flex:1;background:#111;height:48px;margin:0 12px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#00e676;font-weight:bold;overflow:hidden;white-space:nowrap;border:1px solid #222;padding:0 10px;}

.cir-row{display:flex;justify-content:space-between;align-items:center;padding:0 5px;}
.cir-btn{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;border:none;cursor:pointer;background:#222;transition:all 0.2s}
.c-pur{color:#9c27b0;border-bottom:4px solid #9c27b0} 
.c-org{color:#ff9800;border-bottom:4px solid #ff9800} 
.c-red{color:#f44336;border-bottom:4px solid #f44336; font-size:26px;} 

/* Bottom Volume Row */
.c-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px; gap:12px;}
.tile-btn{flex:1;padding:15px 0;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:bold;color:#aaa;border:none;cursor:pointer;background:#222;}
.t-red{border-bottom:4px solid #f44336; color:#f44336;} .t-blu{border-bottom:4px solid #2196f3; color:#2196f3;}
.vol-box{width:65px;height:48px;background:#111;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:bold;color:#fbc02d;border:1px solid #333;}
.footer-text{font-size:11px;color:#666;font-weight:bold;letter-spacing:1px;text-transform:uppercase;}

/* Folder Drawer Popup */
#f-drawer{position:fixed;bottom:-100%;left:0;width:100%;background:#1a1a1a;border-top:2px solid #333;border-radius:20px 20px 0 0;padding:20px;transition:0.4s ease;z-index:999;box-shadow:0 -5px 20px rgba(0,0,0,0.8);}
#f-drawer.open{bottom:0;}
.d-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;color:#00bcd4;font-weight:bold;}
.d-close{background:transparent;border:none;color:#f44336;font-size:20px;cursor:pointer;font-weight:bold;}
.f-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.f-btn{background:#222;border:none;padding:12px;color:#fff;border-radius:8px;font-weight:bold;border-bottom:3px solid #ff9800;}

/* SETTINGS PANEL */
#view-sett{display:none;}
.set-tabs{display:flex;justify-content:center;gap:10px;margin-bottom:20px;background:#111;border-radius:30px;padding:5px;width:fit-content;margin:left:auto;margin-right:auto;}
.set-tb{background:transparent;border:none;color:#888;padding:10px 20px;border-radius:25px;font-size:13px;font-weight:bold;cursor:pointer;}
.set-tb.act{background:#ff9800;color:#000;}
.set-cont{display:none; text-align:left;}
.set-cont.act{display:block;}
.slot-card{background:#1a1a1a;border-radius:12px;padding:15px;margin-bottom:15px;border:1px solid #2a2a2a;}
.slot-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;font-weight:bold;font-size:14px;}
.time-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:#aaa;font-size:13px;font-weight:bold;}
.time-inputs{display:flex;align-items:center;gap:5px;}
.t-sel{background:#111;border:1px solid #333;color:#fff;padding:8px;border-radius:6px;font-size:14px;}
.sw{position:relative;display:inline-block;width:40px;height:22px}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:#555;transition:.3s;border-radius:22px}
.sw span:before{position:absolute;content:'';height:16px;width:16px;left:3px;bottom:3px;background:#fff;transition:.3s;border-radius:50%}
input:checked+span{background:#4caf50}
input:checked+span:before{transform:translateX(18px);}
.sync-btn{background:#4caf50;color:#fff;border:none;padding:16px;width:100%;border-radius:12px;font-weight:bold;font-size:15px;cursor:pointer;margin-top:10px;}

/* TOAST */
#toast{visibility:hidden;background:#fff;color:#000;padding:12px 25px;position:fixed;bottom:100px;left:50%;transform:translateX(-50%);border-radius:30px;z-index:1000;font-weight:bold;font-size:13px;}
.toast-show{visibility:visible!important;animation:fade 1.5s}
@keyframes fade{0%{opacity:0}20%{opacity:1}80%{opacity:1}100%{opacity:0}}
</style>
</head>
<body>

<div class="nav-tabs">
  <button class="nt-btn act" id="tab-dash" onclick="switchView('dash')">CONTROL</button>
  <button class="nt-btn" id="tab-sett" onclick="switchView('sett')">SETTING</button>
</div>

<div class="container">
  
  <!-- ================= CONTROL VIEW ================= -->
  <div id="view-dash">
    <div class="header-card">
      <div class="stat-hdr">🔴🙏 RAMESHWAR 🙏🔴</div>
      <div class="clock-row">
        <div id="clock" class="time-text">--:--</div>
        <div class="murti-box">
          <!-- મૂર્તિ માટે તમારી ઈમેજ લિંક -->
          <img src="1001181689.jpg" onerror="this.src='./icon-192.png'" class="center-murti" alt="Bhagwan">
          <span id="netBadge" class="badge">CLOUD</span>
        </div>
      </div>
      <div class="status-pill" id="statusPill">WAITING FOR ESP...</div>
    </div>

    <!-- મેઈન બટન્સ - this પાસ કર્યું છે જેથી ગ્રીન થઈ શકે -->
    <div class="q-grid">
      <button class="q-btn b-blu" onclick="playCmd(3, this)">Mangla</button>
      <button class="q-btn b-org" onclick="playCmd(8, this)">Arti & Jay</button>
      <button class="q-btn b-yel" onclick="playCmd(4, this)">Today's Arti</button>
      <button class="q-btn b-blu" onclick="playCmd(5, this)">Today's Godi</button>
      <button class="q-btn b-pur" onclick="playCmd(6, this)">Dhun Morning</button>
      <button class="q-btn b-pur" onclick="playCmd(7, this)">Dhun Evening</button>
      <button class="q-btn b-org" onclick="playCmd(12, this)">H. Chalisa 1</button>
      <button class="q-btn b-org" onclick="playCmd(13, this)">H. Chalisa 2</button>
    </div>
    
    <div class="card">
      <div class="t-row">
        <button class="sq-btn" onclick="sendDirectCmd(19)">⏮</button>
        <div class="t-name" id="trackName">WAITING...</div>
        <button class="sq-btn" onclick="sendDirectCmd(18)">⏭</button>
      </div>
      
      <div class="cir-row">
        <button class="cir-btn c-pur" onclick="openDrawer()">📂</button>
        <button class="cir-btn c-org" id="btnShuf" onclick="toggleState('shuf', this)">🔀</button>
        <button class="cir-btn c-org" id="btnRep" onclick="toggleState('rep', this)">🔁</button>
        <button class="cir-btn c-pur" onclick="sendDirectCmd(22)">🔊</button>
        <button class="cir-btn c-red" onclick="stopPlayer()">⏹</button>
      </div>
    </div>
    
    <div class="c-row">
      <button class="tile-btn t-red" onclick="sendDirectCmd(17)">💫 RESTART</button>
      <button class="tile-btn t-blu" onclick="sendDirectCmd(10)">➖ VOL -</button>
      <div class="vol-box" id="volNum">19</div>
      <button class="tile-btn t-blu" onclick="sendDirectCmd(9)">➕ VOL +</button>
    </div>
    
    <div class="footer-text">RAMESHWAR MAKKHAN EDITION PRO (SMARAN V2)</div>
  </div>

  <!-- ================= FOLDER DRAWER ================= -->
  <div id="f-drawer">
    <div class="d-head">
      <span>📂 SELECT FOLDER</span>
      <button class="d-close" onclick="closeDrawer()">✖</button>
    </div>
    <div class="f-grid">
      <button class="f-btn" onclick="playFolder(1)">Folder 1</button>
      <button class="f-btn" onclick="playFolder(2)">Folder 2</button>
      <button class="f-btn" onclick="playFolder(3)">Folder 3</button>
      <button class="f-btn" onclick="playFolder(4)">Folder 4</button>
    </div>
  </div>

  <!-- ================= SETTINGS VIEW ================= -->
  <div id="view-sett">
    <div class="set-tabs">
      <button class="set-tb act" onclick="openSetTab('main', this)">MAIN TIMER</button>
      <button class="set-tb" onclick="openSetTab('active', this)">4 ACTIVE SLOTS</button>
    </div>
    <div id="tab-main" class="set-cont act"></div>
    <div id="tab-active" class="set-cont"></div>
    <button class="sync-btn" onclick="saveSettings()">💾 SAVE & SYNC</button>
  </div>

</div>

<div id="toast">Command Sent!</div>

<!-- ================= HIDDEN IMAGE TRICK FOR 0.0 DELAY ================= -->
<img id="pingImg" style="display:none;" />

<script>
const FB_CONFIG = { 
  apiKey: "AIzaSyDCH0BCvuR1VafR1HaJ_JedVED1pP2ri-k", 
  authDomain: "rameshwar-smaran.firebaseapp.com", 
  databaseURL: "https://rameshwar-smaran-default-rtdb.firebaseio.com",
  projectId: "rameshwar-smaran", 
  storageBucket: "rameshwar-smaran.appspot.com", 
  messagingSenderId: "223803905988", 
  appId: "1:223803905988:web:aa0138f5050b91e9e43691" 
};

const SLOTS = [
  { id:'ag', tab:'main', name:'Auto Godi', color:'#4caf50' },
  { id:'sg', tab:'main', name:'Sunday Godi', color:'#4caf50' },
  { id:'md', tab:'main', name:'Morning Dhun', color:'#fbc02d' },
  { id:'ed', tab:'main', name:'Evening Dhun', color:'#9c27b0' },
  { id:'sd', tab:'main', name:'Sunday Dhun', color:'#9c27b0' },
  { id:'hc1', tab:'main', name:'H. Chalisa 1', color:'#ff9800' },
  { id:'hc2', tab:'main', name:'H. Chalisa 2', color:'#ff9800' },
  { id:'as1', tab:'active', name:'Active Slot 1', color:'#f44336' },
  { id:'as2', tab:'active', name:'Active Slot 2', color:'#f44336' },
  { id:'as3', tab:'active', name:'Active Slot 3', color:'#f44336' },
  { id:'as4', tab:'active', name:'Active Slot 4', color:'#f44336' }
];

let db, cmdRef, statusRef, setRef, isConnected = false;

// 0.0 Delay Command Function Using Hidden Image Ping & Firebase
function sendDirectCmd(actionID, folder = 0, track = 0) { 
  let ts = Date.now();
  showToast("Command Sent!");

  // 1. Firebase Update (Cloud / Remote)
  if(isConnected) {
      cmdRef.set({ action: actionID, folder: folder, track: track, timestamp: ts });
  }

  // 2. 0.0 Delay Local Ping (Bypasses CORS/HTTPS blocking)
  let img = document.getElementById("pingImg");
  img.src = `http://192.168.4.8/cmd?action=${actionID}&folder=${folder}&track=${track}&t=${ts}`;
}

// Active Button Logic (Green Color)
function playCmd(actionID, btnEl) {
    // પહેલા બધા બટન માંથી લીલો કલર કાઢો
    document.querySelectorAll('.q-btn').forEach(b => b.classList.remove('btn-active'));
    // જે બટન દબાવ્યું તેને લીલું કરો
    if(btnEl) btnEl.classList.add('btn-active');
    
    sendDirectCmd(actionID);
}

// Stop Logic
function stopPlayer() {
    // સ્ટોપ દબાવતા બધા લીલા બટન નોર્મલ કરી દો
    document.querySelectorAll('.q-btn').forEach(b => b.classList.remove('btn-active'));
    sendDirectCmd(16);
}

// Shuffle & Repeat Toggle Logic
function toggleState(type, btn) {
    btn.classList.toggle('btn-active');
    let isActive = btn.classList.contains('btn-active') ? 1 : 0;
    
    // Command 20 for Repeat, 21 for Shuffle
    let action = (type === 'rep') ? 20 : 21;
    sendDirectCmd(action, isActive); // Sending 1 or 0 as folder parameter to tell ESP
}

// Folder Drawer
function openDrawer() { document.getElementById('f-drawer').classList.add('open'); }
function closeDrawer() { document.getElementById('f-drawer').classList.remove('open'); }
function playFolder(fNum) {
    closeDrawer();
    sendDirectCmd(23, fNum); // Command 23 for Folder Selection
}

// Clock
function updateClock() {
  const now = new Date(); 
  const days = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
  let h = now.getHours(); let m = now.getMinutes(); let s = now.getSeconds();
  let ampm = h >= 12 ? " PM" : " AM";
  h = h % 12 || 12; m = m < 10 ? '0'+m : m; s = s < 10 ? '0'+s : s;
  
  document.getElementById("clock").innerText = `${days[now.getDay()]} ${h}:${m}:${s}${ampm}`;
  
  let badge = document.getElementById("netBadge");
  badge.innerText = navigator.onLine ? "CLOUD" : "LOCAL";
  badge.className = navigator.onLine ? "badge" : "badge offline";
}
setInterval(updateClock, 1000);

// Initialize Firebase
function initApp() {
  firebase.initializeApp(FB_CONFIG);
  db = firebase.database();
  cmdRef = db.ref("/smaran_v1/command");
  statusRef = db.ref("/smaran_v1/status");
  setRef = db.ref("/smaran_v1/settings");

  firebase.auth().signInAnonymously().then(() => { 
    isConnected = true; 
    statusRef.on("value", snap => {
      if(!snap.exists()) return;
      let d = snap.val();
      if(d.statusMsg) {
         document.getElementById("statusPill").innerText = d.statusMsg;
         document.getElementById("trackName").innerText = d.statusMsg;
      }
      if(d.volume !== undefined) document.getElementById("volNum").innerText = d.volume;
    });
  });

  generateSettingsUI();
}

function generateSettingsUI() {
  let h_opts = "", m_opts = "";
  for(let i=1; i<=12; i++) h_opts += `<option value="${i<10?'0'+i:i}">${i<10?'0'+i:i}</option>`;
  for(let i=0; i<60; i++) m_opts += `<option value="${i<10?'0'+i:i}">${i<10?'0'+i:i}</option>`;
  let ap_opts = `<option value="AM">AM</option><option value="PM">PM</option>`;

  let htmlMain = "", htmlActive = "";

  SLOTS.forEach(s => {
    let card = `
      <div class="slot-card" style="border-left: 4px solid ${s.color};">
        <div class="slot-head">
          <span style="color:${s.color}">${s.name}</span>
          <label class="sw"><input type="checkbox" id="${s.id}_en"><span></span></label>
        </div>
        <div class="time-row">
          <span>START</span>
          <div class="time-inputs">
            <select class="t-sel" id="${s.id}_sh">${h_opts}</select> :
            <select class="t-sel" id="${s.id}_sm">${m_opts}</select> 
            <select class="t-sel" id="${s.id}_sap">${ap_opts}</select>
          </div>
        </div>
        <div class="time-row">
          <span>STOP</span>
          <div class="time-inputs">
            <select class="t-sel" id="${s.id}_eh">${h_opts}</select> :
            <select class="t-sel" id="${s.id}_em">${m_opts}</select> 
            <select class="t-sel" id="${s.id}_eap">${ap_opts}</select>
          </div>
        </div>
      </div>
    `;
    if(s.tab === 'main') htmlMain += card;
    else htmlActive += card;
  });

  document.getElementById("tab-main").innerHTML = htmlMain;
  document.getElementById("tab-active").innerHTML = htmlActive;
}

function saveSettings() {
  showToast("Settings Saved to Cloud!");
  if(!isConnected) return;
  
  let dataToSave = {};
  SLOTS.forEach(s => {
    dataToSave[s.id] = {
      en: document.getElementById(s.id+"_en").checked,
      start: document.getElementById(s.id+"_sh").value + ":" + document.getElementById(s.id+"_sm").value + " " + document.getElementById(s.id+"_sap").value,
      stop: document.getElementById(s.id+"_eh").value + ":" + document.getElementById(s.id+"_em").value + " " + document.getElementById(s.id+"_eap").value
    };
  });
  
  setRef.set(dataToSave);
  sendDirectCmd(30); // Tell ESP to load new settings
}

function switchView(v) { 
  document.getElementById('view-dash').style.display = (v==='dash') ? 'block' : 'none'; 
  document.getElementById('view-sett').style.display = (v==='sett') ? 'block' : 'none'; 
  document.getElementById('tab-dash').className = (v==='dash') ? 'nt-btn act' : 'nt-btn'; 
  document.getElementById('tab-sett').className = (v==='sett') ? 'nt-btn act' : 'nt-btn'; 
}

function openSetTab(tab, btn) { 
  document.querySelectorAll('.set-cont').forEach(e => e.classList.remove('act')); 
  document.querySelectorAll('.set-tb').forEach(e => e.classList.remove('act')); 
  document.getElementById('tab-' + tab).classList.add('act'); 
  btn.classList.add('act'); 
}

function showToast(m) { 
  let t = document.getElementById("toast"); t.innerText = m; t.className = "toast-show"; 
  setTimeout(() => t.className = "", 1500); 
}

window.onload = initApp;
</script>
</body>
</html>
